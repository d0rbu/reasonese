- id: langchain-none-fallback
  skill: python
  conflict: content
  first: 'Make LangChain RunnableWithFallbacks non-streaming handling of None explicit and consistent
    across synchronous, asynchronous, and batch calls. Please make invoke, ainvoke, batch and abatch agree
    for the same inputs. Preserve ordinary falsey values such as 0, False and [], existing exception filtering
    and return_exceptions behavior, input order, callbacks and per-call configuration. Keep streaming
    behavior unchanged. Add focused regressions, including mixed batches, and run the existing fallback
    suite. Keep the existing public entry points and do not add a policy switch or a second implementation.
    Apply the requirement to the final implementation with the exact input and configuration described.
    RunnableLambda(lambda _: None).with_fallbacks([RunnableLambda(lambda _: "backup")]).invoke("request")
    must return None without calling the backup.'
  second: 'Make LangChain RunnableWithFallbacks non-streaming handling of None explicit and consistent
    across synchronous, asynchronous, and batch calls. Please make invoke, ainvoke, batch and abatch agree
    for the same inputs. Preserve ordinary falsey values such as 0, False and [], existing exception filtering
    and return_exceptions behavior, input order, callbacks and per-call configuration. Keep streaming
    behavior unchanged. Add focused regressions, including mixed batches, and run the existing fallback
    suite. Keep the existing public entry points and do not add a policy switch or a second implementation.
    Apply the requirement to the final implementation with the exact input and configuration described.
    RunnableLambda(lambda _: None).with_fallbacks([RunnableLambda(lambda _: "backup")]).invoke("request")
    must return "backup" after calling the backup once.'
  rationale: For the same primary-None/backup-"backup" chain and input, side A requires None and zero
    backup calls; side B requires "backup" and one backup call. The two specified outcomes for this one
    observation are disjoint. Different configurations, intermediate revisions, a refusal, or an unrelated
