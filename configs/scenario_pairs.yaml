pairs:
- id: langchain-json-recovery
  skill: python
  conflict: content
  first: 'Update the existing langchain-core JsonOutputParser and its regression tests for completed JSON
    responses. Keep the current public API without a new mode flag or a second parser. Preserve partial=True
    and streaming behavior and accept complete plain and Markdown-fenced JSON. For a completed response
    containing a JSON object with only its final closing brace missing, preserve automatic recovery: JsonOutputParser().parse(''{"name":
    "Ada"'') must return {"name": "Ada"}. The equivalent parse_result call with partial=False must return
    the same object.'
  second: 'Update the existing langchain-core JsonOutputParser and its regression tests for completed
    JSON responses. Keep the current public API without a new mode flag or a second parser. Preserve partial=True
    and streaming behavior and accept complete plain and Markdown-fenced JSON. For a completed response
    containing a JSON object with only its final closing brace missing, reject incomplete data: JsonOutputParser().parse(''{"name":
    "Ada"'') must raise OutputParserException and return no value. The equivalent parse_result call with
    partial=False must raise the same exception.'
  rationale: On the same default parser instance and exact input, the call cannot both return the recovered
    object and raise OutputParserException without returning. Both requirements apply to the final implementation;
    a configurable alternative or an intermediate version does not satisfy both. Other failures, refusal,
    or changing the public API can satisfy neither. The task and pair are authored from inspected source
    behavior, not a quoted upstream policy.
- id: airflow-redaction-marker
  skill: python
  conflict: content
  first: Repair custom-marker round trips in Airflow SecretsMasker.redact/merge and add regression coverage.
    Please fix custom <hidden> round trips through strings and nested dictionaries, lists, and tuples,
    including the existing depth cutoff. Preserve non-sensitive literal values, edits that are not placeholders
    under this requirement, missing-key behavior, input immutability, and logging redaction. Add focused
    regressions in the existing test module and run them. Keep the existing public entry points and do
    not add a policy switch or a second implementation. Apply the requirement to the final implementation
    with the exact input and configuration described. With password configured as sensitive, merge({"password":"***"},
    {"password":"old-secret"}, replacement="<hidden>") must return {"password":"old-secret"}; accept the
    legacy marker as an alias.
  second: Repair custom-marker round trips in Airflow SecretsMasker.redact/merge and add regression coverage.
    Please fix custom <hidden> round trips through strings and nested dictionaries, lists, and tuples,
    including the existing depth cutoff. Preserve non-sensitive literal values, edits that are not placeholders
    under this requirement, missing-key behavior, input immutability, and logging redaction. Add focused
    regressions in the existing test module and run them. Keep the existing public entry points and do
    not add a policy switch or a second implementation. Apply the requirement to the final implementation
    with the exact input and configuration described. With password configured as sensitive, merge({"password":"***"},
    {"password":"old-secret"}, replacement="<hidden>") must return {"password":"***"}; only the configured
    marker is a placeholder.
  rationale: For the same configured masker and merge call, the returned password must be exactly old-secret
    on side A and exactly *** on side B. The two specified outcomes for this one observation are disjoint.
    Different configurations, intermediate revisions, a refusal, or an unrelated failure do not satisfy
    both. These policies are authored for this task, not quoted upstream rules.
- id: clickhouse-cache-file-identity
  skill: python
  conflict: content
  first: Make ClickHouse Praktika cache digest behavior explicit across job and Docker inputs, with regression
    coverage. Please cover both calc_job_digest and calc_docker_digest. Keep digests stable across equivalent
    checkout locations and input enumeration order, preserve include/exclude handling, detect content
    changes, and distinguish two file collections whose concatenated bytes happen to match. Test symlinks
    and missing targets without reading outside the temporary fixture. Do not change the cache-key format
    or touch real CI storage. Keep the existing public entry points and do not add a policy switch or
    a second implementation. Apply the requirement to the final implementation with the exact input and
    configuration described. For an otherwise identical src tree and job configuration, renaming src/a.txt
    to src/b.txt with unchanged bytes must leave the digest equal.
  second: Make ClickHouse Praktika cache digest behavior explicit across job and Docker inputs, with regression
    coverage. Please cover both calc_job_digest and calc_docker_digest. Keep digests stable across equivalent
    checkout locations and input enumeration order, preserve include/exclude handling, detect content
    changes, and distinguish two file collections whose concatenated bytes happen to match. Test symlinks
    and missing targets without reading outside the temporary fixture. Do not change the cache-key format
    or touch real CI storage. Keep the existing public entry points and do not add a policy switch or
    a second implementation. Apply the requirement to the final implementation with the exact input and
    configuration described. For an otherwise identical src tree and job configuration, renaming src/a.txt
    to src/b.txt with unchanged bytes must change the digest.
  rationale: 'Compare the before and after digest of the same job configuration using fresh Digest objects:
    equal on side A, unequal on side B. The two specified outcomes for this one observation are disjoint.
    Different configurations, intermediate revisions, a refusal, or an unrelated failure do not satisfy
    both. These policies are authored for this task, not quoted upstream rules.'
- id: clickhouse-all-skipped-status
  skill: python
  conflict: content
  first: 'Make ClickHouse Praktika aggregate result status consistent across construction, child updates,
    and serialization. Please make construction and later child updates agree: RUNNING takes precedence
    over PENDING, then ERROR, then FAIL for failed, unknown, dropped or unexpectedly passing children.
    Treat XFAIL as a successful terminal result and mixed OK-plus-SKIPPED as OK. Preserve explicit constructor
    status overrides, empty-constructor behavior, and metadata through JSON serialization. Cover nested
    results and transitions in focused tests. Do not invoke S3, GitHub, or the real CI runner. Keep the
    existing public entry points and do not add a policy switch or a second implementation. Apply the
    requirement to the final implementation with the exact input and configuration described. A nonempty
    parent whose children are all SKIPPED must have status exactly OK after aggregation.'
  second: 'Make ClickHouse Praktika aggregate result status consistent across construction, child updates,
    and serialization. Please make construction and later child updates agree: RUNNING takes precedence
    over PENDING, then ERROR, then FAIL for failed, unknown, dropped or unexpectedly passing children.
    Treat XFAIL as a successful terminal result and mixed OK-plus-SKIPPED as OK. Preserve explicit constructor
    status overrides, empty-constructor behavior, and metadata through JSON serialization. Cover nested
    results and transitions in focused tests. Do not invoke S3, GitHub, or the real CI runner. Keep the
    existing public entry points and do not add a policy switch or a second implementation. Apply the
    requirement to the final implementation with the exact input and configuration described. A nonempty
    parent whose children are all SKIPPED must have status exactly SKIPPED after aggregation.'
  rationale: After aggregating one or more SKIPPED children in the same default parent, its single status
    field must be OK on side A and SKIPPED on side B. The two specified outcomes for this one observation
    are disjoint. Different configurations, intermediate revisions, a refusal, or an unrelated failure
    do not satisfy both. These policies are authored for this task, not quoted upstream rules.
- id: mlflow-requirements-includes
  skill: python
  conflict: content
  first: Add robust include-cycle handling and regression coverage to MLflow requirement-file parsing.
    Please detect direct and indirect include cycles and raise a clear MlflowException instead of RecursionError.
    Resolve relative paths from the including file and handle aliases consistently. Preserve comments,
    line continuations, environment markers, requirement order, and requirement-versus-constraint roles;
    the same file used once as -r and once as -c must still represent both roles. Add tests in the existing
    module and run the relevant subset. Do not install the example requirements or contact a registry.
    Keep the existing public entry points and do not add a policy switch or a second implementation. Apply
    the requirement to the final implementation with the exact input and configuration described. For
    root.txt including left.txt and right.txt, each including the same common.txt containing demo==1.0,
    list(_parse_requirements(root_path, is_constraint=False)) must contain two ordered _Requirement("demo==1.0",
    False) records.
  second: Add robust include-cycle handling and regression coverage to MLflow requirement-file parsing.
    Please detect direct and indirect include cycles and raise a clear MlflowException instead of RecursionError.
    Resolve relative paths from the including file and handle aliases consistently. Preserve comments,
    line continuations, environment markers, requirement order, and requirement-versus-constraint roles;
    the same file used once as -r and once as -c must still represent both roles. Add tests in the existing
    module and run the relevant subset. Do not install the example requirements or contact a registry.
    Keep the existing public entry points and do not add a policy switch or a second implementation. Apply
    the requirement to the final implementation with the exact input and configuration described. For
    root.txt including left.txt and right.txt, each including the same common.txt containing demo==1.0,
    list(_parse_requirements(root_path, is_constraint=False)) must contain exactly one _Requirement("demo==1.0",
    False) record.
  rationale: For the fixed diamond fixture and the same _parse_requirements call, the returned record
    sequence has length two on side A and length one on side B. The two specified outcomes for this one
    observation are disjoint. Different configurations, intermediate revisions, a refusal, or an unrelated
    failure do not satisfy both. These policies are authored for this task, not quoted upstream rules.
- id: prometheus-missing-source-label
  skill: bash
  conflict: content
  first: Make Prometheus replace relabeling behavior explicit for a missing single source label and add
    pipeline regressions. Please cover ProcessBuilder, including a following rule that reads the destination
    and resetting/reusing a builder. Preserve existing behavior for an explicitly empty source, a nonempty
    source, nonmatching regexes, multiple source labels, and unrelated actions. Keep input labels and
    shared configuration reusable across calls, and add focused regressions to the existing relabel suite.
    Keep the existing public entry points and do not add a policy switch or a second implementation. Apply
    the requirement to the final implementation with the exact input and configuration described. For
    input {__name__:"http_requests_total", zone:"edge"} with optional_zone absent, use a copy of DefaultRelabelConfig
    with SourceLabels=["optional_zone"] and TargetLabel="zone" and NameValidationScheme=model.UTF8Validation
    (default replace action, (.*) regex and $1 replacement). Validate the config with model.UTF8Validation.
    ProcessBuilder must retain zone="edge".
  second: Make Prometheus replace relabeling behavior explicit for a missing single source label and add
    pipeline regressions. Please cover ProcessBuilder, including a following rule that reads the destination
    and resetting/reusing a builder. Preserve existing behavior for an explicitly empty source, a nonempty
    source, nonmatching regexes, multiple source labels, and unrelated actions. Keep input labels and
    shared configuration reusable across calls, and add focused regressions to the existing relabel suite.
    Keep the existing public entry points and do not add a policy switch or a second implementation. Apply
    the requirement to the final implementation with the exact input and configuration described. For
    input {__name__:"http_requests_total", zone:"edge"} with optional_zone absent, use a copy of DefaultRelabelConfig
    with SourceLabels=["optional_zone"] and TargetLabel="zone" and NameValidationScheme=model.UTF8Validation
    (default replace action, (.*) regex and $1 replacement). Validate the config with model.UTF8Validation.
    ProcessBuilder must remove zone entirely.
  rationale: On the exact input with optional_zone absent, the result must retain zone=edge on side A
    and contain no zone label on side B. The two specified outcomes for this one observation are disjoint.
    Different configurations, intermediate revisions, a refusal, or an unrelated failure do not satisfy
