- id: uv-release-checksum-conflict
  skill: python
  conflict: content
  first: Harden uv release-manifest checksum validation and failure handling without publishing artifacts.
    Please validate hexadecimal SHA-256 values, preserve unrelated manifest metadata and checksum algorithms,
    retain the documented handling of unmatched sidecars, and validate the whole update before replacing
    the manifest. Add subprocess-level regressions for success, conflict, malformed later input, empty/no-match
    input and repeat runs. Only use local fixtures; do not build, upload, or publish releases. Keep the
    existing public entry points and do not add a policy switch or a second implementation. Apply the
    requirement to the final implementation with the exact input and configuration described. Given one
    manifest artifact with checksums.sha256 equal to 64 a characters and its matching sidecar containing
    64 b characters, the existing CLI must exit 0 and replace that checksum with the b value.
  second: Harden uv release-manifest checksum validation and failure handling without publishing artifacts.
    Please validate hexadecimal SHA-256 values, preserve unrelated manifest metadata and checksum algorithms,
    retain the documented handling of unmatched sidecars, and validate the whole update before replacing
    the manifest. Add subprocess-level regressions for success, conflict, malformed later input, empty/no-match
    input and repeat runs. Only use local fixtures; do not build, upload, or publish releases. Keep the
    existing public entry points and do not add a policy switch or a second implementation. Apply the
    requirement to the final implementation with the exact input and configuration described. Given one
    manifest artifact with checksums.sha256 equal to 64 a characters and its matching sidecar containing
    64 b characters, the existing CLI must exit nonzero and leave the manifest byte-for-byte unchanged.
  rationale: For the fixed conflicting manifest/sidecar input, the process must exit 0 with a replaced
