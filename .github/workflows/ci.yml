name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap mawk slirp4netns nftables ripgrep
          # Allow Bubblewrap's namespaces on this disposable Ubuntu test runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked --extra probes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/pi-transcripts/package-lock.json
      - name: Install pinned Pi harness
        run: npm ci --prefix tools/pi-transcripts --ignore-scripts --no-audit --no-fund
      - name: Pi transcript offline integration
        run: npm --prefix tools/pi-transcripts test
      - name: Ruff
        run: uv run ruff check .
      - name: Ty
        run: uv run ty check
      - name: Pytest
        run: uv run pytest
