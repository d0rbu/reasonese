[project]
name = "reasonese"
version = "0.1.0"
description = "Controlled experiments on how authors and representations shape instructions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Henry Castillo" }]
dependencies = [
    "beartype>=0.22.0",
    "phantom-types>=3.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
]

[project.scripts]
reasonese-axes = "reasonese.show_axes:main"
reasonese-plan = "reasonese.plan:main"
reasonese-run-conversation = "reasonese.run_conversation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=reasonese",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["reasonese"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty]
# Type checker is `ty` from Astral. Run `uv run ty check`.

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv/", "docs/", "dist/", "build/"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "dist", "build", "out", "outputs", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    "E501", # line too long; formatting and prose readability own this
]

[tool.ruff.lint.isort]
known-first-party = ["reasonese", "tests"]
