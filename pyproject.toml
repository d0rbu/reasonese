[project]
name = "reasonese"
version = "0.1.0"
description = "Controlled experiments on how authors and representations shape instructions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Henry Castillo" }]
dependencies = [
    "beartype>=0.22.0",
    "numpy>=2.2.0",
    "phantom-types>=3.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "threadpoolctl>=3.5.0",
]

[project.optional-dependencies]
probes = [
    "accelerate==1.12.0",
    "einops==0.8.2",
    "kernels==0.15.2",
    "safetensors==0.8.0",
    "scikit-learn>=1.8.0",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[project.scripts]
reasonese-axes = "reasonese.show_axes:main"
reasonese-plan = "reasonese.plan:main"
reasonese-sample-studies = "reasonese.sample_studies:main"
reasonese-run-conversation = "reasonese.run_conversation:main"
reasonese-check-messages = "reasonese.check_messages:main"
reasonese-judge-responses = "reasonese.judge_responses:main"
reasonese-collect-data = "reasonese.collect_data:main"
reasonese-collect-studies = "reasonese.collect_studies:main"
reasonese-analyze = "reasonese.analyze:main"
reasonese-curate-instructions = "reasonese.curate_instructions:main"
reasonese-write-variants = "reasonese.write_variants:main"
reasonese-extract-role-activations = "reasonese.extract_role_activations:main"
reasonese-role-probe = "reasonese.manage_role_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "scikit-learn>=1.8.0",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=reasonese",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["reasonese"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ty]
# Type checker is `ty` from Astral. Run `uv run ty check`.

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv/", "docs/", "dist/", "build/"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "dist", "build", "out", "outputs", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    "E501", # line too long; formatting and prose readability own this
]

[tool.ruff.lint.isort]
known-first-party = ["reasonese", "tests"]
